name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Example wiki passes its own checks
        shell: bash
        run: |
          python skill/grounded-learning-wiki/glw.py check --root example --strict
          python skill/grounded-learning-wiki/glw.py learn-status --root example --strict
