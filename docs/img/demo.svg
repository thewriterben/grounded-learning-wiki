<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">glw.py on the example wiki</title>
  <desc id="d">Five commands. TRAPPIST-1g is not in the wiki, so resolve asks whether you meant 1e or 1f. A typo, trnasit, is read as transit and reported. A versioned page asks for v1 or v2. A hot Jupiter is a gap. check rejects a number that is not in any quote and a number with no source.</desc>
  <style>
    .bg{fill:#0d1117}.bar{fill:#161b22}.edge{stroke:#30363d}
    .cmd{fill:#e6edf3}.prompt{fill:#7d8590}.note{fill:#7d8590}
    .ask{fill:#e3b341}.res{fill:#3fb950}.gap{fill:#d2a8ff}.err{fill:#ff7b72}.out{fill:#c9d1d9}
    text{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:15px}
    .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
  </style>
  <rect class="bg edge" x=".5" y=".5" width="1199" height="519" rx="14" stroke-width="1"/>
  <path class="bar" d="M1 14.5A13.5 13.5 0 0 1 14.5 1H1185.5A13.5 13.5 0 0 1 1199 14.5V42H1Z"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/><circle cx="46" cy="22" r="6" fill="#febc2e"/><circle cx="66" cy="22" r="6" fill="#28c840"/>
  <text class="ui note" x="600" y="26" text-anchor="middle">example/  ·  outputs condensed from glw.py's JSON</text>

  <g transform="translate(32 80)">
    <text class="prompt" x="0" y="0">$</text><text class="cmd" x="20" y="0">glw.py resolve -- "What is the radius of TRAPPIST-1g?"</text>
    <text class="ask" x="20" y="26">needs_clarification</text><text class="out" x="230" y="26">'1g' is not in the wiki. Did you mean 1e or 1f?</text>

    <text class="prompt" x="0" y="74">$</text><text class="cmd" x="20" y="74">glw.py resolve -- "How does the trnasit method work?"</text>
    <text class="res" x="20" y="100">resolved</text><text class="out" x="230" y="100">wiki/concepts/transit-method.md · reading 'trnasit' as 'transit'</text>

    <text class="prompt" x="0" y="148">$</text><text class="cmd" x="20" y="148">glw.py resolve -- "What threshold does the light-curve pipeline use?"</text>
    <text class="ask" x="20" y="174">needs_clarification</text><text class="out" x="230" y="174">The answer for 'Light-curve pipeline' depends on its version: v1 or v2?</text>

    <text class="prompt" x="0" y="222">$</text><text class="cmd" x="20" y="222">glw.py resolve --record-gap -- "What is a hot Jupiter?"</text>
    <text class="gap" x="20" y="248">gap</text><text class="out" x="230" y="248">unknown: hot, jupiter · filed wiki/gaps/hot-jupiter.md</text>

    <text class="prompt" x="0" y="296">$</text><text class="cmd" x="20" y="296">glw.py check --strict</text><text class="note" x="250" y="296"># after changing 0.92 to 0.95 and adding an unsourced 40</text>
    <text class="err" x="20" y="322">ERROR</text><text class="out" x="90" y="322">trappist-1e.md:8: 0.95 is not in any quote this line cites</text>
    <text class="err" x="20" y="348">ERROR</text><text class="out" x="90" y="348">trappist-1e.md:14: uncited number(s) 40</text>
    <text class="out" x="20" y="374">checked 16 pages: 2 error(s), 0 warning(s)</text>
  </g>

  <text class="ui note" x="32" y="496">The model never supplies a number: if it is not in a quote from raw/, check fails.</text>
</svg>
