# Policy for the exoplanet example wiki.

[resolve]
# Optional: a command that may suggest pages for a question that did not resolve. It reads JSON on
# stdin and prints {"offers": [...]}; offers are asked, never chosen. Off unless set.
# resolver_cmd = ["python", "tools/meaning.py"]

[resolve.synonyms]
"exo planet" = "exoplanet"

[seek]
policy = "queue"            # auto | queue | off
research_after_days = 7
stale_after_days = 180
trusted_hosts = ["exoplanetarchive.ipac.caltech.edu"]
